worker_processes 1;
error_log stderr warn;
pid /run/nginx.pid;
events { worker_connections 1024; }
http {
    include mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    geo $chamilo_trusted_proxy {
        default 0;
        include /etc/nginx/chamilo-trusted-proxies.conf;
    }
    map $chamilo_trusted_proxy $chamilo_forwarded_for { default ""; 1 $http_x_forwarded_for; }
    map $chamilo_trusted_proxy $chamilo_forwarded_host { default ""; 1 $http_x_forwarded_host; }
    map $chamilo_trusted_proxy $chamilo_forwarded_port { default ""; 1 $http_x_forwarded_port; }
    map "$chamilo_trusted_proxy:$http_x_forwarded_proto" $chamilo_forwarded_proto {
        default "";
        "1:http" http;
        "1:https" https;
    }
    map $chamilo_forwarded_proto $chamilo_https { default ""; https on; }
    server {
        listen 8080 default_server;
        server_name _;
        root ${nginx_root_directory};
        index index.php;
        client_max_body_size ${client_max_body_size};
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        location ~ /\. { deny all; }
        location = /check.php { return 404; }
        location = /legacy.php { return 404; }
        location ~ ^/main/install/ {
            if (-f /data/installed) { return 403; }
            if (-f /tmp/chamilo-installer-disabled) { return 403; }
            try_files $uri =404;
            location ~ \.php$ {
                if (-f /data/installed) { return 403; }
                if (-f /tmp/chamilo-installer-disabled) { return 403; }
                include fastcgi_params;
            include /etc/nginx/chamilo-fastcgi-proxy.conf;
                fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
                fastcgi_param HTTP_AUTHORIZATION $http_authorization;
                fastcgi_pass unix:/run/php-fpm.sock;
            }
        }
        location ~ ^/(main|plugin)/ {
            try_files $uri $uri/ =404;
            location ~ \.php(?:/|$) {
                fastcgi_split_path_info ^(.+?\.php)(/.*)$;
                set $chamilo_path_info $fastcgi_path_info;
                try_files $fastcgi_script_name =404;
                include fastcgi_params;
            include /etc/nginx/chamilo-fastcgi-proxy.conf;
                fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
                fastcgi_param PATH_INFO $chamilo_path_info;
                fastcgi_param HTTP_AUTHORIZATION $http_authorization;
                fastcgi_pass unix:/run/php-fpm.sock;
            }
        }
        location ~* ^/(build|bundles|documentation|fonts|img|libs|sound)/ {
            location ~* \.php(?:/|$) { return 404; }
            try_files $uri =404;
        }
        location = /index.php {
            include fastcgi_params;
            include /etc/nginx/chamilo-fastcgi-proxy.conf;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            fastcgi_param HTTP_AUTHORIZATION $http_authorization;
            fastcgi_pass unix:/run/php-fpm.sock;
        }
        location ~ \.php(?:/|$) { return 404; }
        location = /fpm-ping {
            allow 127.0.0.1;
            deny all;
            include fastcgi_params;
            include /etc/nginx/chamilo-fastcgi-proxy.conf;
            fastcgi_param SCRIPT_FILENAME $document_root/fpm-ping;
            fastcgi_pass unix:/run/php-fpm.sock;
        }
        location / { try_files $uri /index.php$is_args$args; }
    }
}
