services:
  chamilo:
    image: ${CHAMILO_IMAGE:-alpine-chamilo:test}
    build: .
    environment:
      CHAMILO_INSTALLER_ENABLED: ${CHAMILO_INSTALLER_ENABLED:-false}
      CHAMILO_TRUSTED_PROXIES: ${CHAMILO_TRUSTED_PROXIES:-}
    ports:
      - "127.0.0.1:${CHAMILO_PORT:-8080}:8080"
    volumes:
      - chamilo-state:/data:${CHAMILO_STATE_MODE:-rw}
      - chamilo-config:/var/www/html/config:${CHAMILO_CONFIG_MODE:-rw}
      - chamilo-var:/var/www/html/var
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: chamilo
      MARIADB_USER: chamilo
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - chamilo-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  chamilo-state:
  chamilo-config:
  chamilo-var:
  chamilo-db:
