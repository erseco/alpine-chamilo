name: CI
on:
  pull_request:
  push:
    branches: [main, 'feature/**', 'hotfix/**']
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check shell scripts
        run: shellcheck rootfs/docker-entrypoint-init.d/*.sh tests/*.sh
      - name: Validate Compose
        run: DB_PASSWORD=test DB_ROOT_PASSWORD=test docker compose config -q
      - name: Build image
        run: docker build -t alpine-chamilo:test .
      - name: Run smoke tests
        run: tests/smoke.sh
