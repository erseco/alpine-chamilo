name: CI
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, 'feature/**', 'hotfix/**']
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
      - name: Check shell scripts
        run: shellcheck scripts/*.sh rootfs/docker-entrypoint-init.d/*.sh rootfs/usr/local/bin/* rootfs/etc/service/*/run tests/*.sh
      - name: Test release selection and tags
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          tests/release-tags.sh
      - name: Validate Compose
        run: DB_PASSWORD=test DB_ROOT_PASSWORD=test docker compose config -q
      - name: Build image
        run: docker build -t alpine-chamilo:test .
      - name: Report system package vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: alpine-chamilo:test
          scanners: vuln
          vuln-type: os
          skip-dirs: /var/www/html
          severity: HIGH,CRITICAL
          exit-code: '0'
      - name: Reject fixable system package vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: alpine-chamilo:test
          scanners: vuln
          vuln-type: os
          skip-dirs: /var/www/html
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Run smoke tests
        run: tests/smoke.sh
      - name: Test trusted proxy boundaries
        run: tests/proxy.sh
      - name: Install browser test dependencies
        run: |
          npm ci --prefix tests/e2e
          tests/e2e/node_modules/.bin/playwright install --with-deps chromium
      - name: Test real installation and login
        run: tests/install.sh
      - name: Test unattended installation and a derived plugin image
        run: tests/auto-install.sh
