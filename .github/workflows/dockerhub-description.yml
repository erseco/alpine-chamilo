name: Docker Hub description
# Publishes README.md as the Docker Hub overview, with documentation links pointing at the site.
on:
  push:
    branches: [main]
    paths: [README.md, .github/workflows/dockerhub-description.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  description:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Point documentation links at the published site
        run: sed 's#](docs/\([a-z-]*\)\.md\(\#[a-z-]*\)\{0,1\})#](https://erseco.github.io/alpine-chamilo/\1/\2)#g' README.md > "$RUNNER_TEMP/dockerhub-README.md"
      # Needs a Docker Hub token with read/write/delete scope.
      - uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: ${{ github.repository }}
          readme-filepath: ${{ runner.temp }}/dockerhub-README.md
          short-description: Unofficial Chamilo LMS 3.x on Alpine, Nginx and PHP-FPM 8.3 (amd64, arm64)
