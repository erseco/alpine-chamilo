name: Release
# Publishes X.Y.Z plus the X.Y, X and latest aliases when X.Y.Z is the newest release in
# their range. A vX.Y.Z tag releases a Chamilo version; a manual run on main rebuilds the
# current one (for example after a base-image update) and moves the same tags.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.tags.outputs.tags }}
      version: ${{ steps.tags.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Resolve the version and its aliases
        id: tags
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          version=$(sed -n 's/^ARG CHAMILO_VERSION=//p' Dockerfile)
          if [ "$EVENT" = workflow_dispatch ]; then
            [ "$GITHUB_REF" = refs/heads/main ] || { echo 'Rebuild only from main' >&2; exit 1; }
            git rev-parse -q --verify "refs/tags/v$version" >/dev/null || { echo "v$version was never released; push the tag instead" >&2; exit 1; }
          else
            [ "${TAG#v}" = "$version" ] || { echo "Tag $TAG does not match Chamilo $version" >&2; exit 1; }
          fi
          tags=$(git tag | scripts/release-tags.sh "$version")
          echo "Publishing: $tags"
          printf 'version=%s\ntags=%s\n' "$version" "$tags" >> "$GITHUB_OUTPUT"
  test:
    needs: version
    uses: ./.github/workflows/ci.yml
  ghcr:
    needs: [version, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image references
        id: refs
        env:
          TAGS: ${{ needs.version.outputs.tags }}
        run: |
          set -eu
          {
            echo 'refs<<EOF'
            for tag in $TAGS; do echo "ghcr.io/$GITHUB_REPOSITORY:$tag"; done
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          tags: ${{ steps.refs.outputs.refs }}
      - name: Smoke-test the published amd64 image
        env:
          CHAMILO_IMAGE: ghcr.io/${{ github.repository }}@${{ steps.push.outputs.digest }}
        run: |
          docker pull "$CHAMILO_IMAGE"
          docker buildx imagetools inspect "$CHAMILO_IMAGE" | grep -q 'linux/arm64'
          tests/smoke.sh
  dockerhub:
    needs: [version, ghcr]
    runs-on: ubuntu-latest
    steps:
      - name: Require Docker Hub credentials
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          [ -n "$DOCKER_USERNAME" ] && [ -n "$DOCKER_PASSWORD" ] || {
            echo '::error::Set the DOCKER_USERNAME and DOCKER_PASSWORD secrets, then re-run this job.'
            exit 1
          }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Copy the exact GHCR manifest to Docker Hub
        env:
          DIGEST: ${{ needs.ghcr.outputs.digest }}
          TAGS: ${{ needs.version.outputs.tags }}
        run: |
          set -eu
          source="ghcr.io/$GITHUB_REPOSITORY@$DIGEST"
          set --
          for tag in $TAGS; do set -- "$@" -t "docker.io/$GITHUB_REPOSITORY:$tag"; done
          docker buildx imagetools create "$@" "$source"
          for tag in $TAGS; do
            for registry in ghcr.io docker.io; do
              actual=$(docker buildx imagetools inspect "$registry/$GITHUB_REPOSITORY:$tag" --format '{{json .Manifest.Digest}}' | tr -d '"')
              [ "$actual" = "$DIGEST" ] || { echo "$registry tag $tag points to $actual, expected $DIGEST" >&2; exit 1; }
            done
          done
          # Backticks are literal Markdown.
          # shellcheck disable=SC2016
          printf '| Registry | Tags | Digest |\n|---|---|---|\n| ghcr.io, docker.io | %s | `%s` |\n' "$TAGS" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
